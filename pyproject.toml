[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pipisso-filedesk"
version = "0.2.0"
description = "Offline desktop file processing workspace"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
filedesk = "filedesk.app:main"

[tool.setuptools.package-data]
filedesk = ["qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
